name: Build macOS App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-macos-app:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pyinstaller -r requirements.txt

      - name: Build macOS App
        run: |
          pyinstaller --windowed --icon=icon.icns --name "Evangel Monitor Health" --collect-all imgui_bundle evangel_monitor_health.py

      - name: Stage macOS app bundle
        run: |
          mkdir -p upload
          cp -R "dist/Evangel Monitor Health.app" upload/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Evangel-Monitor-Health-app
          path: upload